 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝕻𝖎𝖟𝖟𝖆 𝕻𝖆𝖕𝖎</title>
    <link rel="icon" type="image/png" href="https://github.com/user-attachments/assets/d82c4e73-fe77-422b-b21a-09247c452edb">
    <link rel="stylesheet" href="styleMain.css">
    <link rel="stylesheet" href="styleGame.css">
</head>

<body>
    <header>
        <img alt="pizza logo" src="https://github.com/user-attachments/assets/d82c4e73-fe77-422b-b21a-09247c452edb"/>
        <nav>
        <a href="index.html">Home</a>
        <a href="types.html">Types of Pizza</a>
        <a href="game.html">Mini-Game</a>
        <a href="board.html">Leaderboard</a>
        <a href="about.html">About</a>
        </nav>
    </header>

    <section class="info">
        <div class="info-box">
                <h1>Pizzaria Papia</h1>
                <div class="gameBtn">
                    <button id="start">Start</button>
                    <p id="countDown">00:30</p>
                </div>
        </div>

        <div id="gameArea" style="display:none;" ondrop="dropHandler(event)"   ondragover="dragoverHandler(event)">
            <img src="../assets/basePizza.png" id="base" draggable="true" ondragstart="dragstartHandler(event)">
            <img src="../assets/cheese.png" class="sprite" id="cheese" draggable="true" ondragstart="dragstartHandler(event)">
            <img src="../assets/ham.png" class="sprite" id="ham" draggable="true" ondragstart="dragstartHandler(event)">
            <img src="../assets/mushrooms.png" class="sprite" id="mushrooms" draggable="true" ondragstart="dragstartHandler(event)">
            <img src="../assets/olives.png" class="sprite" id="olives" draggable="true" ondragstart="dragstartHandler(event)">
            <img src="../assets/onions.png" class="sprite" id="onions" draggable="true" ondragstart="dragstartHandler(event)">
            <img src="../assets/pepper.png" class="sprite" id="pepper" draggable="true" ondragstart="dragstartHandler(event)">
            <img src="../assets/pepperoni.png" class="sprite" id="pepperoni" draggable="true" ondragstart="dragstartHandler(event)">
            <img src="../assets/pineapple.png" class="sprite" id="pineapple" draggable="true" ondragstart="dragstartHandler(event)">
        </div>
    </section>

    <footer>
        <p>Copyright © Bascon, Margarito</p>
    </footer>

    <script src="game.js"></script>
</body>

</html>
