 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝕻𝖎𝖟𝖟𝖆 𝕻𝖆𝖕𝖎</title>
    <link rel="icon" type="image/png" href="https://github.com/user-attachments/assets/d82c4e73-fe77-422b-b21a-09247c452edb">
    <link rel="stylesheet" href="styleMain.css">
    <link rel="stylesheet" href="styleGame.css">
</head>

<body>
    <header>
        <img alt="pizza logo" src="https://github.com/user-attachments/assets/d82c4e73-fe77-422b-b21a-09247c452edb"/>
        <nav>
        <a href="./index.html">Home</a>
        <a href="./public/types.html">Types of Pizza</a>
        <a href="./public/game.html">Mini-Game</a>
        <a href="./public/board.html">Leaderboard</a>
        <a href="./public/about.html">About</a>
    </header>

    <section class="info">
        <div class="info-box">
                <h1>Pizzaria Papia</h1>
                <div class="gameBtn">
                    <button id="start">Start</button>
                    <p id="order"></p>
                    <p id="countDown">00:30</p>
                    <button id="serve" style="display:none">Serve</button>
                    <p id="score"></p>
                </div>
        </div>

        <div id="gameArea" style="display:none" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)">
            <div class = "baseArea">
                <img src="../assets/basePizza.png" id="base">
            </div>
            <img src="../assets/cheese.png" class="sprite" id="cheese">
            <img src="../assets/ham.png" class="sprite" id="ham">
            <img src="../assets/mushrooms.png" class="sprite" id="mushrooms">
            <img src="../assets/olives.png" class="sprite" id="olives">
            <img src="../assets/onions.png" class="sprite" id="onions">
            <img src="../assets/pepper.png" class="sprite" id="pepper">
            <img src="../assets/pepperoni.png" class="sprite" id="pepperoni">
            <img src="../assets/pineapple.png" class="sprite" id="pineapple">
        </div>
    </section>

    <footer>
        <p>Copyright © Bascon, Margarito</p>
    </footer>

    <script src="game.js"></script>
</body>

</html>
