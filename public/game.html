 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝕻𝖎𝖟𝖟𝖆 𝕻𝖆𝖕𝖎</title>
    <link rel="icon" type="image/png" href="https://github.com/user-attachments/assets/d82c4e73-fe77-422b-b21a-09247c452edb">
    <link rel="stylesheet" href="styleMain.css">
    <link rel="stylesheet" href="styleGame.css">
</head>

<body>
    <header>
        <img alt="pizza logo" src="https://github.com/Steph0801/WDProjCesiumBasconMargarito/blob/main/assets/Untitled1_20251027213658.png?raw=true"/>
        <nav>
            <a href="home.html">Home</a>
            <a href="types.html">Types of Pizza</a>
            <a href="game.html" class="nav-active-page">Game</a>
            <a href="board.html">Leaderboard</a>
            <a href="about.html">About</a>
    </header>

    <section class="info">
        <div class="info-box">
            <h1>Pizzaria Papia</h1> 

            <div class="enterName">
                <p id="name">Enter your name: </p>
                <input id="nameId">
            </div>

            <div class="gameBtn">
                <button id="start">Start</button>
                <p id="order"></p>
                <p id="countDown">00:30</p>
                <button id="serve" style="display:none">Serve</button>
                <p id="score"></p>
            </div>
        </div>

        <div id="gameArea" style="display:none" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)">
            <div class = "baseArea">
                <img src="../assets/basePizza.png" id="base">
            </div>

            <figure>
                <img src="../assets/cheese.png" class="sprite" id="cheese" title="cheese">
                <figcaption id="c">cheese</figcaption>
            </figure>

            <figure>
                <img src="../assets/ham.png" class="sprite" id="ham" title="ham">
                <figcaption id="h">ham</figcaption>
            </figure>
            
            <figure>
                <img src="../assets/mushrooms.png" class="sprite" id="mushrooms" title="mushrooms">
                <figcaption id="m">mushrooms</figcaption>
            </figure>
            
            <figure>
                <img src="../assets/olives.png" class="sprite" id="olives" title="olives">
                <figcaption id="ol">olives</figcaption>
            </figure>
            
            <figure>
                <img src="../assets/onions.png" class="sprite" id="onions" title="onions">
                <figcaption id="on">onions</figcaption>
            </figure>
            
            <figure>
                <img src="../assets/pepper.png" class="sprite" id="pepper" title="pepper">
                <figcaption id="ppr">pepper</figcaption>
            </figure>
            
            <figure>
                <img src="../assets/pepperoni.png" class="sprite" id="pepperoni" title="pepperoni">
                <figcaption id="pprn">pepperoni</figcaption>
            </figure>
            
            <figure>
                <img src="../assets/pineapple.png" class="sprite" id="pineapple" title="pineapple">
                <figcaption id="ppnl">pineapple</figcaption>
            </figure>
        </div>
    </section>

     <footer>
       <p>Copyright © Bascon, Margarito</p>
        <div class="float-right-ref">
            <a href="https://steph0801.github.io/WDProjCesiumBasconMargarito/public/about.html">Credits</a>
        </div>
        </footer>
    </body> 

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDX6AYQz5eBQj36Z2Ux2cymyu0jDLvVQYw",
            authDomain: "pizza-mini-game.firebaseapp.com",
            projectId: "pizza-mini-game",
            storageBucket: "pizza-mini-game.firebasestorage.app",
            messagingSenderId: "1039460616322",
            appId: "1:1039460616322:web:fdc7f46cc8f0c08c89cc9b"
        };

        const app = initializeApp(firebaseConfig);
        const database= getFirestore(app);

        window.database = database;
        window.collection = collection;
        window.addDoc = addDoc;
    </script>

    <script src="game.js"></script>
</body>


</html>
