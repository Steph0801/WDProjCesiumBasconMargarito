    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaHG85uDaATvW7zBe6gS6rmnONTLPBwVg",
            authDomain: "pizzagame-1d370.firebaseapp.com",
            projectId: "pizzagame-1d370",
            storageBucket: "pizzagame-1d370.firebasestorage.app",
            messagingSenderId: "772225718708",
            appId: "1:772225718708:web:39ea3ea24279beeb503ae1"
        };

        const app = initializeApp(firebaseConfig);
        const database = getFirestore(app);

        const leaderboardDiv = document.getElementById("leaderboard");

        const q = query(
            collection(database, "leaderboard"),
            orderBy("score", "desc"),
            limit(10)
        );

        const snapshot = await getDocs(q);

        let rank=1;
        snapshot.forEach((doc, index) => {
            const data = doc.data();
            leaderboardDiv.innerHTML += `<p>${rank}. ${data.name} — ${data.score}</p>`;
            rank++;
        });
    </script>
