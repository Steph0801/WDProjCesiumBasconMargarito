        <!-- leaderboard setup (firebase database) -->
        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
            import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

            const firebaseConfig = {
                apiKey: "AIzaSyAaHG85uDaATvW7zBe6gS6rmnONTLPBwVg",
                authDomain: "pizzagame-1d370.firebaseapp.com",
                projectId: "pizzagame-1d370",
                storageBucket: "pizzagame-1d370.firebasestorage.app",
                messagingSenderId: "772225718708",
                appId: "1:772225718708:web:39ea3ea24279beeb503ae1"
            };

            const app = initializeApp(firebaseConfig);
            const database = getFirestore(app);

            const leaderboardDiv = document.getElementById("leaderboard");

            const q = query(
                collection(database, "leaderboard"),
                orderBy("score", "desc"),
                limit(10) //limit to top 10 scoreres
            );

            const snapshot = await getDocs(q);

            let rank=1;
            snapshot.forEach((doc, index) => {
                const data = doc.data();
                leaderboardDiv.innerHTML += `<p>${rank}. ${data.name} — ${data.score}</p>`;
                rank++;
            });
        </script>

    <script>
let comments = JSON.parse(localStorage.getItem('pizzaComments')) || [];
renderComments();

function postNewComment() {
    const nameInput = document.getElementById('comment-user');
    const textInput = document.getElementById('comment-text');

    if (nameInput.value === "" || textInput.value === "") return;

    const newComment = {
        id: Date.now(),
        user: nameInput.value,
        text: textInput.value
    };

    comments.push(newComment);
    saveAndRender();
    nameInput.value = "";
    textInput.value = "";
}

function deleteComment(id) {
    comments = comments.filter(c => c.id !== id);
    saveAndRender();
}

function updateComment(id) {
    const newText = prompt("Edit your comment:");
    if (newText) {
        const comment = comments.find(c => c.id === id);
        comment.text = newText;
        saveAndRender();
    }
}

function saveAndRender() {
    localStorage.setItem('pizzaComments', JSON.stringify(comments));
    renderComments();
}
    
function renderComments() {
    const display = document.getElementById('comments-display');
    if(!display) return;
    display.innerHTML = "";

    comments.forEach(c => {
        display.innerHTML += `
            <div class="comment-card">
                <span class="comment-handle">@${c.user.toLowerCase().replace(/\s/g, '')}</span>
                <p class="comment-body">${c.text}</p>
                <div class="comment-actions">
                    <button onclick="updateComment(${c.id})">Update</button>
                    <button onclick="deleteComment(${c.id})">Delete</button>
                </div>
            </div>
        `;
    });
}
</script>
